# CI pipeline for orderService.
#
# Stages:
#   build          - compile and package the Spring Boot application
#   test           - unit tests (surefire) + integration tests (failsafe:
#                    Testcontainers PostgreSQL + in-process WireMock)
#   code-analysis  - CodeQL static analysis (optional, does not block the pipeline)
#   docker         - build the application image and publish it as a tar artifact
#
# The image is NOT pushed to a registry yet (review first). To enable GHCR:
#   1. add `packages: write` to the docker job permissions
#   2. uncomment the "Publish to GHCR" step below
#   3. set the image name to ghcr.io/<owner>/orderservice (lowercase!)
name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Least privilege by default; jobs opt into extra permissions explicitly
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1: Build -------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The repository is developed on Windows, so the executable bit may be lost
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and package (tests are executed in the next stage)
        run: ./mvnw -B -ntp -DskipTests clean package

      - name: Upload the application jar
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: target/*.jar
          retention-days: 7

  # --- Stage 2: Testing -----------------------------------------------------
  # Integration tests start a PostgreSQL container via Testcontainers, which
  # works out of the box on the GitHub-hosted ubuntu runner (Docker preinstalled).
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # `verify` runs surefire (unit) and failsafe (integration) tests
      - name: Run unit and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Upload the JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # --- Stage 3: Code analysis (optional) ------------------------------------
  # CodeQL is free for public repositories and needs no token. Results are
  # published to the repository Security tab; findings do not fail the build.
  code-analysis:
    name: Code analysis
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile for analysis
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'

  # --- Stage 4: Artefact creation (docker image) ----------------------------
  # The image is built on every run and saved as a downloadable artifact.
  # Publishing to a registry is intentionally disabled for now.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: order-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Kept short to stay within the artifact storage of a free account
      - name: Package the image as a tar archive
        run: docker save order-service:ci-${{ github.sha }} | gzip > order-service-image.tar.gz

      - name: Upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-service-docker-image
          path: order-service-image.tar.gz
          retention-days: 3

      # --- Publish to GHCR (enable after the review) --------------------------
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
