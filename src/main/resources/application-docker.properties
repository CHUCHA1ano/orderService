# --- Docker profile: container names from the shared Docker network ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orderdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (schema is managed by Liquibase) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Keycloak / OAuth2 resource server ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://auth-service-keycloak:8080/realms/jacapp/protocol/openid-connect/certs}

# --- userService integration (internal API) ---
app.integration.user-service.url=${USER_SERVICE_URL:http://user-service-app:8081}
app.integration.user-service.api-key=${INTERNAL_API_KEY}
