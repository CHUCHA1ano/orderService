spring.application.name=orderService
server.port=8082

# --- PostgreSQL (Order DB) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orderdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate (schema managed by Liquibase) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Read paths must initialize everything they map; hidden lazy loading outside a
# transaction would otherwise fail silently and mask N+1 problems.
spring.jpa.open-in-view=false
# The dialect is detected from the JDBC connection; an explicit value is deprecated in Hibernate 7.

# --- Pagination limits (protect the API from huge page sizes) ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Actuator (health only, used by docker-compose) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Liquibase ---
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# --- Keycloak / OAuth2 resource server ---
# jwk-set-uri is used instead of issuer-uri so the application does not call Keycloak on startup.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/jacapp/protocol/openid-connect/certs}

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- userService integration (internal API, key from env, no default) ---
app.integration.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
app.integration.user-service.api-key=${INTERNAL_API_KEY}

# --- Resilience4j circuit breaker for the userService client ---
resilience4j.circuitbreaker.instances.userService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.automaticTransitionFromOpenToHalfOpenEnabled=true
# A missing user (404) is a normal business outcome, not a userService failure
resilience4j.circuitbreaker.instances.userService.ignoredExceptions=com.innowise.orderservice.exception.UserNotFoundException

spring.profiles.active=local
